<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>飞机大战 - Sky Strike</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Microsoft YaHei', sans-serif;
    overflow: hidden;
    position: fixed;
    inset: 0;
    width: 100%;
  }
  #gameContainer {
    position: relative;
    width: 480px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 2/3;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #0a0e1a 0%, #111827 50%, #0a0e1a 100%);
    border: 1px solid rgba(0, 212, 255, 0.3);
    box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
    touch-action: none;
  }
  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(10, 14, 26, 0.92);
    z-index: 10;
    color: #e2e8f0;
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: 42px;
    background: linear-gradient(90deg, #00d4ff, #7c3aed, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 4px;
    margin-bottom: 10px;
    font-weight: 800;
    text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
  }
  .subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }
  .btn {
    padding: 14px 40px;
    border: 1px solid rgba(0, 212, 255, 0.5);
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(124, 58, 237, 0.18));
    color: #22d3ee;
    font-size: 18px;
    cursor: pointer;
    border-radius: 8px;
    letter-spacing: 2px;
    transition: all 0.3s;
    margin: 8px;
    font-family: inherit;
  }
  .btn:hover {
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.3), rgba(124, 58, 237, 0.3));
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    transform: translateY(-2px);
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .btn-small {
    padding: 8px 20px;
    font-size: 14px;
    margin: 4px;
  }
  .btn-gold {
    border-color: rgba(251, 191, 36, 0.5);
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(245, 158, 11, 0.18));
    color: #fbbf24;
  }
  .btn-gold:hover {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.3), rgba(245, 158, 11, 0.3));
    box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
  }
  .btn-danger {
    border-color: rgba(244, 63, 94, 0.5);
    background: linear-gradient(135deg, rgba(244, 63, 94, 0.15), rgba(220, 38, 38, 0.18));
    color: #f43f5e;
  }
  .btn-danger:hover {
    background: linear-gradient(135deg, rgba(244, 63, 94, 0.3), rgba(220, 38, 38, 0.3));
    box-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
  }
  .instructions {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 20px;
    text-align: center;
    line-height: 2;
  }
  .instructions span { color: #22d3ee; }
  .instructions .gold { color: #fbbf24; }
  .instructions .danger { color: #f43f5e; }
  .hud {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 5;
    font-size: 13px;
    color: #e2e8f0;
    text-shadow: 0 0 5px rgba(0,0,0,0.8);
    flex-wrap: wrap;
    gap: 6px;
  }
  .hud-item { display: flex; align-items: center; gap: 5px; }
  .hp-bar {
    width: 80px;
    height: 8px;
    background: rgba(255, 0, 0, 0.3);
    border: 1px solid rgba(244, 63, 94, 0.5);
    border-radius: 4px;
    overflow: hidden;
  }
  .hp-fill {
    height: 100%;
    background: linear-gradient(90deg, #f43f5e, #fb923c);
    transition: width 0.3s;
  }
  .boss-bar {
    position: absolute;
    top: 50px; left: 10%;
    width: 80%;
    height: 12px;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(244, 63, 94, 0.6);
    border-radius: 6px;
    overflow: hidden;
    z-index: 5;
  }
  .boss-fill {
    height: 100%;
    background: linear-gradient(90deg, #dc2626, #f59e0b, #fbbf24);
    transition: width 0.2s;
  }
  .boss-name {
    text-align: center;
    font-size: 12px;
    color: #fbbf24;
    margin-top: 2px;
    text-shadow: 0 0 5px rgba(0,0,0,0.8);
  }
  .mobile-controls {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: none;
    pointer-events: none;
  }
  .mobile-controls .joy-zone {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 58%;
    height: 75%;
    pointer-events: auto;
    touch-action: none;
  }
  .mobile-controls .joystick {
    position: absolute;
    width: 118px;
    height: 118px;
    border: 2px solid rgba(0, 212, 255, 0.55);
    border-radius: 50%;
    background: rgba(0, 212, 255, 0.08);
    pointer-events: none;
    display: none;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 18px rgba(0, 212, 255, 0.25);
  }
  .mobile-controls .joystick.show { display: block; }
  .mobile-controls .fire-btn {
    position: absolute;
    bottom: 26px;
    right: 22px;
    width: 88px;
    height: 88px;
    border: 2px solid rgba(244, 63, 94, 0.7);
    border-radius: 50%;
    background: rgba(244, 63, 94, 0.22);
    color: #fecaca;
    font-size: 26px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 0.12s, background 0.2s;
  }
  .mobile-controls .fire-btn:active {
    background: rgba(244, 63, 94, 0.42);
    transform: scale(0.92);
  }
  @media (pointer: coarse), (max-width: 820px) {
    .mobile-controls { display: block; }
  }

  /* ===== In-game action buttons (pause / shop / cheat) ===== */
  .play-actions {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 6;
    pointer-events: none;
  }
  .play-actions .pa-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(0, 212, 255, 0.5);
    background: rgba(15, 23, 42, 0.55);
    color: #22d3ee;
    font-size: 18px;
    cursor: pointer;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.2s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(2px);
  }
  .play-actions .pa-btn:active { transform: scale(0.88); }
  .play-actions .pa-btn:hover { background: rgba(0, 212, 255, 0.25); }
  .play-actions .pa-cheat {
    border-color: rgba(251, 191, 36, 0.75);
    color: #fbbf24;
    background: rgba(245, 158, 11, 0.2);
    width: 52px;
    height: 52px;
    font-size: 24px;
    box-shadow: 0 0 10px rgba(251, 191, 36, 0.25);
  }
  .play-actions .pa-cheat.active {
    background: linear-gradient(135deg, rgba(251,191,36,0.6), rgba(244,63,94,0.5));
    box-shadow: 0 0 22px rgba(251, 191, 36, 0.85);
    animation: godPulse 1s ease-in-out infinite;
  }
  /* 任意覆盖层显示时，隐藏对局内按钮 */
  .overlay:not(.hidden) ~ .play-actions { display: none; }
  .level-info {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: #94a3b8;
    font-size: 13px;
    text-shadow: 0 0 5px rgba(0,0,0,0.8);
    z-index: 5;
  }
  .combo {
    position: absolute;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fbbf24;
    font-size: 26px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 5;
    pointer-events: none;
  }
  .combo.show { opacity: 1; }

  /* 商店UI */
  .shop-panel {
    width: 90%;
    max-width: 420px;
    max-height: 80%;
    overflow-y: auto;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 12px;
    padding: 20px;
  }
  .shop-title {
    font-size: 24px;
    color: #fbbf24;
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 3px;
  }
  .shop-gold-info {
    text-align: center;
    color: #fbbf24;
    font-size: 16px;
    margin-bottom: 16px;
    padding: 8px;
    background: rgba(251, 191, 36, 0.1);
    border-radius: 6px;
    border: 1px solid rgba(251, 191, 36, 0.2);
  }
  .shop-item {
    display: flex;
    align-items: center;
    padding: 12px;
    margin-bottom: 10px;
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 8px;
    transition: all 0.2s;
  }
  .shop-item:hover {
    border-color: rgba(0, 212, 255, 0.4);
    background: rgba(30, 41, 59, 0.9);
  }
  .shop-item-icon {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .shop-item-info {
    flex: 1;
    min-width: 0;
  }
  .shop-item-name {
    font-size: 15px;
    color: #e2e8f0;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .shop-item-desc {
    font-size: 12px;
    color: #94a3b8;
    line-height: 1.4;
  }
  .shop-item-buy {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    margin-left: 8px;
  }
  .shop-item-price {
    color: #fbbf24;
    font-size: 14px;
    font-weight: 600;
  }
  .shop-close {
    margin-top: 16px;
    text-align: center;
  }
  .shop-msg {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 16px;
    background: rgba(0,0,0,0.8);
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 20;
  }
  .shop-msg.show { opacity: 1; }
  .shop-msg.error { color: #f43f5e; border: 1px solid rgba(244,63,94,0.5); }
  .shop-msg.success { color: #10b981; border: 1px solid rgba(16,185,129,0.5); }

  /* 金币飞行动画 */
  .coin-fly {
    position: absolute;
    pointer-events: none;
    color: #fbbf24;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 0 8px rgba(251,191,36,0.8);
    z-index: 6;
    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* 无敌状态标识 */
  .godmode-indicator {
    position: absolute;
    top: 75px;
    left: 50%;
    transform: translateX(-50%);
    padding: 4px 12px;
    background: linear-gradient(90deg, rgba(244,63,94,0.2), rgba(251,191,36,0.2), rgba(34,211,238,0.2));
    border: 1px solid rgba(251,191,36,0.5);
    border-radius: 12px;
    font-size: 11px;
    color: #fbbf24;
    letter-spacing: 2px;
    text-shadow: 0 0 6px rgba(251,191,36,0.6);
    z-index: 5;
    animation: godPulse 1s ease-in-out infinite;
    display: none;
  }
  .godmode-indicator.show { display: block; }
  @keyframes godPulse {
    0%, 100% { opacity: 0.8; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
  }

  /* 滚动条美化 */
  .shop-panel::-webkit-scrollbar { width: 6px; }
  .shop-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
  .shop-panel::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.4); border-radius: 3px; }
  .shop-panel::-webkit-scrollbar-thumb:hover { background: rgba(0,212,255,0.6); }

  .btn-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game" width="480" height="720"></canvas>

  <div class="hud">
    <div class="hud-item">
      <span>❤️</span>
      <div class="hp-bar"><div class="hp-fill" id="hpFill" style="width:100%"></div></div>
    </div>
    <div class="hud-item">
      <span>⭐</span>
      <span id="scoreText">0</span>
    </div>
    <div class="hud-item" style="color:#fbbf24">
      <span>🪙</span>
      <span id="coinText">0</span>
    </div>
    <div class="hud-item">
      <span>💣</span>
      <span id="bombText">2</span>
    </div>
  </div>

  <div id="godModeIndicator" class="godmode-indicator">⚡ 开 挂 模 式 ⚡</div>

  <div id="bossBar" class="boss-bar" style="display:none">
    <div class="boss-fill" id="bossFill" style="width:100%"></div>
    <div class="boss-name" id="bossName">BOSS</div>
  </div>

  <div class="level-info">
    <span id="levelText">第 1 关</span>
  </div>

  <div id="comboDisplay" class="combo"></div>

  <div id="shopMsg" class="shop-msg"></div>

  <div id="startScreen" class="overlay">
    <div class="title">SKY STRIKE</div>
    <div class="subtitle">飞 机 大 战</div>
    <div class="btn-row">
      <button class="btn" onclick="Game.start()">开 始 游 戏</button>
      <button class="btn btn-gold" onclick="Shop.open()">🛒 商 店</button>
    </div>
    <div class="instructions">
      <div><span>WASD / 方向键</span> 移动战机</div>
      <div><span>空格</span> 释放炸弹 &nbsp; <span>B</span> 打开商店</div>
      <div><span>ESC</span> 暂停 &nbsp; <span class="danger">Ctrl+G</span> 开挂模式</div>
      <div style="margin-top:6px;color:#94a3b8">📱 手机：<span>左侧拖动</span>移动 &nbsp; <span>右下💣</span>炸弹 &nbsp; 右侧<span style="color:#fbbf24">⚡</span>开挂</div>
      <div style="margin-top:8px;color:#64748b">击杀敌人获取 <span class="gold">🪙金币</span>，可在商店购买强化道具！</div>
    </div>
  </div>

  <div id="pauseScreen" class="overlay hidden">
    <div class="title" style="font-size:32px">PAUSED</div>
    <div class="btn-row">
      <button class="btn" onclick="Game.togglePause()">继 续</button>
      <button class="btn btn-gold" onclick="Shop.open()">🛒 商 店</button>
      <button class="btn" onclick="Game.restart()">重 新 开 始</button>
      <button class="btn btn-danger" onclick="Game.toggleGodMode()">⚡ 开挂模式</button>
    </div>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <div class="title" style="color:#f43f5e">GAME OVER</div>
    <div class="subtitle">最终得分: <span id="finalScore" style="color:#fbbf24">0</span></div>
    <div class="subtitle">最高纪录: <span id="highScore" style="color:#00d4ff">0</span></div>
    <div class="subtitle">本局金币: <span id="finalCoins" style="color:#fbbf24">+0</span> &nbsp; 总金币: <span id="totalCoins" style="color:#fbbf24">0</span></div>
    <div class="btn-row">
      <button class="btn" onclick="Game.restart()">再 来 一 局</button>
      <button class="btn btn-gold" onclick="Shop.open()">🛒 商 店</button>
      <button class="btn" onclick="Game.toMenu()">返 回 主 菜 单</button>
    </div>
  </div>

  <div id="levelClearScreen" class="overlay hidden">
    <div class="title" style="color:#10b981">LEVEL CLEAR</div>
    <div class="subtitle" id="levelClearText">关卡通过！</div>
    <div class="subtitle">即将进入下一关...</div>
  </div>

  <div id="shopScreen" class="overlay hidden">
    <div class="shop-panel">
      <div class="shop-title">🛒 金 币 商 店</div>
      <div class="shop-gold-info">🪙 当前金币: <span id="shopCoinDisplay">0</span></div>
      <div id="shopItems"></div>
      <div class="shop-close">
        <button class="btn btn-small" onclick="Shop.close()">关 闭</button>
      </div>
    </div>
  </div>

  <div class="play-actions" id="playActions">
    <button class="pa-btn" id="pauseBtn" type="button" aria-label="暂停">⏸</button>
    <button class="pa-btn" id="shopBtn" type="button" aria-label="商店">🛒</button>
    <button class="pa-btn pa-cheat" id="cheatBtn" type="button" aria-label="开挂模式" title="开挂模式">⚡</button>
  </div>

  <div class="mobile-controls">
    <div class="joy-zone" id="joyZone"></div>
    <div class="joystick" id="joystick">
      <div id="joystickStick" style="position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(0,212,255,0.5);border:1px solid #00d4ff;top:36px;left:36px"></div>
    </div>
    <div class="fire-btn" id="fireBtn">💣</div>
  </div>
</div>

<script>
// ============ CONFIG ============
const CONFIG = {
  CANVAS: { W: 480, H: 720 },
  PLAYER: {
    w: 32, h: 36, speed: 5,
    maxHp: 5, hp: 5,
    maxBombs: 5, bombs: 2,
    invincibleTime: 1500,
  },
  POWER_LEVELS: [
    null,
    { count: 1, spread: 0, dmg: 1, rate: 180 },
    { count: 2, spread: 15, dmg: 1, rate: 170 },
    { count: 3, spread: 20, dmg: 1, rate: 160 },
    { count: 4, spread: 25, dmg: 2, rate: 150 },
    { count: 5, spread: 35, dmg: 2, rate: 140 },
    { count: 6, spread: 40, dmg: 3, rate: 120 },
    { count: 7, spread: 45, dmg: 3, rate: 100 },
  ],
  ENEMY_TYPES: {
    scout:   { w:26, h:26, hp:1, speed:3.8, score:100, drop:0.05, color:'#ef4444', behavior:'straight', coinMin:2, coinMax:5 },
    assault: { w:34, h:34, hp:3, speed:2.0, score:300, drop:0.15, color:'#f59e0b', behavior:'zigzag', coinMin:5, coinMax:10 },
    kami:    { w:28, h:28, hp:2, speed:4.2, score:500, drop:0.20, color:'#ec4899', behavior:'chase', coinMin:8, coinMax:15 },
    heavy:   { w:44, h:44, hp:8, speed:1.0, score:800, drop:0.40, color:'#8b5cf6', behavior:'hover', fireRate: 1200, coinMin:15, coinMax:30 },
    elite:   { w:40, h:40, hp:15, speed:1.5, score:2000, drop:1.00, color:'#06b6d4', behavior:'mixed', coinMin:30, coinMax:60 },
  },
  BOSS_DATA: {
    boss1: { name:'侦察艇', w:120, h:80, hp:80, speed:0.8, color:'#ef4444', patterns:['spread'], fireRate:2500, coinReward:100 },
    boss2: { name:'突击舰', w:140, h:90, hp:150, speed:1.0, color:'#f59e0b', patterns:['spread','ring'], fireRate:2200, coinReward:200 },
    boss3: { name:'防空炮', w:150, h:100, hp:220, speed:0.6, color:'#8b5cf6', patterns:['ring','laser','spread'], fireRate:2000, coinReward:350 },
    boss4: { name:'战列舰', w:170, h:110, hp:320, speed:1.2, color:'#ec4899', patterns:['spread','ring','homing','summon'], fireRate:1800, coinReward:500 },
    boss5: { name:'终极旗舰', w:190, h:120, hp:500, speed:1.4, color:'#f43f5e', patterns:['spread','ring','spiral','homing','laser','summon'], fireRate:1500, coinReward:800 },
  },
  LEVELS: [
    null,

// ============ SAVE SYSTEM ============
const Save = {
  KEY: 'skyStrikeSave_v1',
  data: {
    totalCoins: 0,
    highScore: 0,
    perks: {}, // 购买的永久升级等级
  },
  load() {
    try {
      const saved = localStorage.getItem(this.KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        this.data = { ...this.data, ...parsed, perks: parsed.perks || {} };
      }
    } catch(e) { console.warn('Load save failed:', e); }
  },
  save() {
    try {
      localStorage.setItem(this.KEY, JSON.stringify(this.data));
    } catch(e) { console.warn('Save failed:', e); }
  },
  addCoins(n) {
    this.data.totalCoins += n;
    this.save();
  },
  spendCoins(n) {
    if (this.data.totalCoins >= n) {
      this.data.totalCoins -= n;
      this.save();
      return true;
    }
    return false;
  },
  getPerk(key) {
    return this.data.perks[key] || 0;
  },
  getTotalPerkValue(key, perLevel) {
    return this.getPerk(key) * perLevel;
  },
  buyPerk(item) {
    const currentLvl = this.getPerk(item.id);
    if (currentLvl >= item.maxLevel) return false;
    const cost = item.price + Math.floor(currentLvl * item.price * 0.5);
    if (!this.spendCoins(cost)) return false;
    this.data.perks[item.id] = currentLvl + 1;
    this.save();
    return true;
  },
  getPerkCost(item) {
    const currentLvl = this.getPerk(item.id);
    return item.price + Math.floor(currentLvl * item.price * 0.5);
  },
  setHighScore(s) {
    if (s > this.data.highScore) {
      this.data.highScore = s;
      this.save();
    }
  }
};

// ============ AUDIO ============
const Audio = {
  ctx: null,
  init() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) { console.log('Audio not supported'); }
    }
  },
  play(type) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    switch(type) {
      case 'shoot': this._beep(880, 0.06, 'square', 880, 440); break;
      case 'hit': this._beep(200, 0.12, 'sawtooth', 200, 80); break;
      case 'explode': this._noise(0.35, 2000, 100); break;
      case 'powerup': this._arpeggio([523, 659, 784, 1047]); break;
      case 'boss': this._beep(80, 0.8, 'sawtooth', 80, 220); break;
      case 'bomb': this._noise(1.2, 3000, 50); break;
      case 'levelup': this._arpeggio([523, 784, 1047, 1319]); break;
      case 'coin': this._arpeggio([1047, 1319]); break;
    }
  },
  _beep(freq, dur, type, freqEnd=0) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, this.ctx.currentTime + dur);
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + dur);
  },
  _noise(dur, filterStart, filterEnd) {
    const bufferSize = this.ctx.sampleRate * dur;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const source = this.ctx.createBufferSource();
    source.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(filterStart, this.ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(filterEnd, this.ctx.currentTime + dur);
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    source.connect(filter).connect(gain).connect(this.ctx.destination);
    source.start();
    source.stop(this.ctx.currentTime + dur);
  },
  _arpeggio(notes) {
    notes.forEach((freq, i) => {
      setTimeout(() => this._beep(freq, 0.1, 'sine'), i * 60);
    });
  }
};

// ============ UTILS ============
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function dist(x1, y1, x2, y2) { return Math.sqrt((x2-x1)**2 + (y2-y1)**2); }
function checkCollision(a, b, m=3) {
  return (a.x + m < b.x + b.w - m &&
          a.x + a.w - m > b.x + m &&
          a.y + m < b.y + b.h - m &&
          a.y + a.h - m > b.y + m);
}

const Input = {
  keys: {},
  joystick: { active: false, x: 0, y: 0 },
  ctrlDown: false,
  init() {
    try {
      window.addEventListener('keydown', e => {
        this.keys[e.key.toLowerCase()] = true;
        if (e.key === 'Control' || e.key === 'Meta') this.ctrlDown = true;
        if (e.key === 'Escape' && window.Game) {
          if (Shop.isOpen()) Shop.close();
          else Game.togglePause();
        }
        if (e.key === ' ') { e.preventDefault(); if(window.Game) Game.useBomb(); }
        // B 打开商店
        if (e.key.toLowerCase() === 'b' && window.Game && (Game.state === 'playing' || Game.state === 'paused')) {
          Shop.open();
        }
        // Ctrl+G 开挂模式
        if ((this.ctrlDown || e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'g' && window.Game) {
          e.preventDefault();
          Game.toggleGodMode();
        }
      });
      window.addEventListener('keyup', e => {
        this.keys[e.key.toLowerCase()] = false;
        if (e.key === 'Control' || e.key === 'Meta') this.ctrlDown = false;
      });

      const joyZone = document.getElementById('joyZone');
      const joy = document.getElementById('joystick');
      const stick = document.getElementById('joystickStick');
      const container = document.getElementById('gameContainer');
      if (joyZone && joy && stick && container) {
        let activeId = null;
        const joyStart = (clientX, clientY) => {
          this.joystick.active = true;
          const cRect = container.getBoundingClientRect();
          joy.style.left = (clientX - cRect.left) + 'px';
          joy.style.top = (clientY - cRect.top) + 'px';
          joy.classList.add('show');
          this._updateJoystick(clientX, clientY, joy, stick);
        };
        const joyMove = (clientX, clientY) => {
          if (this.joystick.active) this._updateJoystick(clientX, clientY, joy, stick);
        };
        const joyEnd = () => {
          this.joystick.active = false;
          this.joystick.x = 0;
          this.joystick.y = 0;
          joy.classList.remove('show');
          stick.style.left = '36px';
          stick.style.top = '36px';
        };
        joyZone.addEventListener('touchstart', e => {
          e.preventDefault();
          const t = e.changedTouches[0];
          activeId = t.identifier;
          joyStart(t.clientX, t.clientY);
        }, { passive: false });
        joyZone.addEventListener('touchmove', e => {
          e.preventDefault();
          if (activeId === null) return;
          for (const t of e.changedTouches) {
            if (t.identifier === activeId) { joyMove(t.clientX, t.clientY); break; }
          }
        }, { passive: false });
        const joyFinish = e => {
          e.preventDefault();
          if (activeId === null) return;
          for (const t of e.changedTouches) {
            if (t.identifier === activeId) { joyEnd(); activeId = null; break; }
          }
        };
        joyZone.addEventListener('touchend', joyFinish, { passive: false });
        joyZone.addEventListener('touchcancel', joyFinish, { passive: false });
      }

      const fireBtn = document.getElementById('fireBtn');
      if (fireBtn) {
        fireBtn.addEventListener('touchstart', e => {
          e.preventDefault();
          if(window.Game) Game.useBomb();
        }, { passive: false });
        fireBtn.addEventListener('click', e => { e.preventDefault(); });
      }

      // 对局内按钮：暂停 / 商店 / 开挂
      const pauseBtn = document.getElementById('pauseBtn');
      if (pauseBtn) pauseBtn.addEventListener('click', () => { if (window.Game) Game.togglePause(); });
      const shopBtn = document.getElementById('shopBtn');
      if (shopBtn) shopBtn.addEventListener('click', () => {
        if (window.Game && (Game.state === 'playing' || Game.state === 'paused')) Shop.open();
      });
      const cheatBtn = document.getElementById('cheatBtn');
      if (cheatBtn) cheatBtn.addEventListener('click', () => { if (window.Game) Game.toggleGodMode(); });

      // 禁止长按弹出上下文菜单
      if (container) {
        container.addEventListener('contextmenu', e => e.preventDefault());
      }
    } catch(e) {
      console.warn('Input init warning:', e);
    }
  },
  _updateJoystick(clientX, clientY, joy, stick) {
    const r = joy.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const center = r.width / 2;
    const stickHalf = stick.offsetWidth / 2;
    const maxR = Math.max(1, center - stickHalf);
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d > maxR && d > 0) { dx = dx / d * maxR; dy = dy / d * maxR; }
    const base = center - stickHalf;
    stick.style.left = (base + dx) + 'px';
    stick.style.top = (base + dy) + 'px';
    this.joystick.x = dx / maxR;
    this.joystick.y = dy / maxR;
  },
  getMovement() {
    let mx = 0, my = 0;
    if (this.keys['a'] || this.keys['arrowleft']) mx -= 1;
    if (this.keys['d'] || this.keys['arrowright']) mx += 1;
    if (this.keys['w'] || this.keys['arrowup']) my -= 1;
    if (this.keys['s'] || this.keys['arrowdown']) my += 1;
    if (this.joystick.active) {
      mx = this.joystick.x;
      my = this.joystick.y;
    }
    if (mx !== 0 && my !== 0) { mx *= 0.707; my *= 0.707; }
    return { x: mx, y: my };
  }
};

// ============ GAME ENTITIES ============
class Bullet {
  constructor(x, y, vx, vy, dmg, isPlayer=true) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.w = 4; this.h = 12;
    this.dmg = dmg;
    this.isPlayer = isPlayer;
    this.dead = false;
    this.color = isPlayer ? '#22d3ee' : '#f43f5e';
    this.homing = false;
    this.life = 0;
  }
  update(dt, player) {
    // 追踪弹逻辑
    if (this.homing && player && this.life > 0) {
      const dx = player.x - this.x;
      const dy = player.y - this.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d > 0) {
        this.vx += (dx/d) * 0.1;
        this.vy += (dy/d) * 0.1;
        const sp = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
        if (sp > 5) { this.vx = this.vx/sp*5; this.vy = this.vy/sp*5; }
      }
      this.life -= dt;
    }
    this.x += this.vx;
    this.y += this.vy;
    if (this.y < -20 || this.y > CONFIG.CANVAS.H + 20 ||
        this.x < -20 || this.x > CONFIG.CANVAS.W + 20) {
      this.dead = true;
    }
  }
  draw(ctx) {
    ctx.save();
    if (this.isPlayer) {
      // 玩家子弹：拉长的光束效果
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x - this.w/2, this.y - this.h/2, this.w, this.h);
      ctx.fillStyle = '#fff';
      ctx.fillRect(this.x - 1, this.y - this.h/2 + 1, 2, this.h - 2);
    } else {
      // 敌方子弹：双层圆模拟光晕，避免 shadowBlur 在弹幕中拖慢渲染
      ctx.fillStyle = this.color;
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

class Particle {
  constructor(x, y, vx, vy, life, color, size=3) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.life = life;
    this.maxLife = life;
    this.color = color;
    this.size = size;
    this.dead = false;
  }
  update(dt) {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.96;
    this.vy *= 0.96;
    this.life -= dt;
    if (this.life <= 0) this.dead = true;
  }
  draw(ctx) {
    const alpha = this.life / this.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
    ctx.restore();
  }
}

class Coin {
  constructor(x, y, value=1) {
    this.x = x; this.y = y;
    this.w = 18; this.h = 18;
    this.vx = rand(-1.5, 1.5);
    this.vy = rand(-2.5, -0.5);
    this.value = value;
    this.dead = false;
    this.life = 8000;
    this.phase = Math.random() * Math.PI * 2;
    this.attracting = false;
  }
  update(dt, player) {
    this.phase += 0.15;
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }

    // 如果玩家靠近或开挂模式，自动吸附
    const attractRange = Game.godMode ? 500 : 80;
    if (player) {
      const d = dist(this.x, this.y, player.x, player.y);
      if (d < attractRange) this.attracting = true;
    }
    if (this.attracting && player) {
      const dx = player.x - this.x;
      const dy = player.y - this.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d > 1) {
        const speed = Game.godMode ? 20 : 8;
        this.vx = dx/d * speed;
        this.vy = dy/d * speed;
      }
    } else {
      this.vy += 0.05; // 轻微重力
      if (this.vy > 2) this.vy = 2;
    }
    this.x += this.vx;
    this.y += this.vy;
    if (this.y > CONFIG.CANVAS.H + 30) this.dead = true;
    this.x = clamp(this.x, 10, CONFIG.CANVAS.W - 10);
  }
  draw(ctx) {
    const bob = Math.sin(this.phase) * 2;
    const alpha = this.life < 2000 ? (this.life / 2000) : 1;
    const scale = 1 + Math.sin(this.phase * 2) * 0.1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(this.x, this.y + bob);
    ctx.scale(scale, 1);
    ctx.shadowColor = '#fbbf24';
    ctx.shadowBlur = 12;
    // 外圈
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(0, 0, 9, 0, Math.PI * 2);
    ctx.fill();
    // 内圈
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(0, 0, 6.5, 0, Math.PI * 2);
    ctx.fill();
    // 文字
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', 0, 0);
    ctx.restore();
  }
}

class PowerUp {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.w = 22; this.h = 22;
    this.vy = 1.5;
    this.type = type;
    this.dead = false;
    this.bobPhase = Math.random() * Math.PI * 2;
    this.colors = {
      power: '#22d3ee',
      heart: '#f43f5e',
      bomb: '#f59e0b',
      shield: '#10b981',
      slow: '#c4b5fd',
    };
    this.labels = {
      power: 'P', heart: '♥', bomb: 'B',
      shield: 'S', slow: '⏱'
    };
  }
  update(dt) {
    this.y += this.vy;
    this.bobPhase += 0.08;
    if (this.y > CONFIG.CANVAS.H + 20) this.dead = true;
  }
  draw(ctx) {
    const bob = Math.sin(this.bobPhase) * 3;
    ctx.save();
    ctx.shadowColor = this.colors[this.type];
    ctx.shadowBlur = 10;
    ctx.fillStyle = this.colors[this.type];
    const rx = this.x - this.w/2, ry = this.y - this.h/2 + bob;
    const rw = this.w, rh = this.h, rr = 4;
    ctx.beginPath();
    ctx.moveTo(rx + rr, ry);
    ctx.lineTo(rx + rw - rr, ry);
    ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + rr);
    ctx.lineTo(rx + rw, ry + rh - rr);
    ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - rr, ry + rh);
    ctx.lineTo(rx + rr, ry + rh);
    ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - rr);
    ctx.lineTo(rx, ry + rr);
    ctx.quadraticCurveTo(rx, ry, rx + rr, ry);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.labels[this.type], this.x, this.y + bob);
    ctx.restore();
  }
}

class Enemy {
  constructor(x, y, type) {
    const data = CONFIG.ENEMY_TYPES[type];
    this.x = x; this.y = y;
    this.w = data.w; this.h = data.h;
    this.hp = data.hp; this.maxHp = data.hp;
    this.speed = data.speed;
    this.score = data.score;
    this.dropRate = data.drop;
    this.color = data.color;
    this.behavior = data.behavior;
    this.type = type;
    this.dead = false;
    this.fireTimer = data.fireRate || 0;
    this.zigzagPhase = Math.random() * Math.PI * 2;
    this.hoverTarget = y + rand(50, 150);
    this.hasEntered = false;
    this.angle = 0;
    this.coinMin = data.coinMin || 1;
    this.coinMax = data.coinMax || 3;
  }
  update(dt, player) {
    this.angle += 0.05;
    this.zigzagPhase += 0.06;

    switch(this.behavior) {
      case 'straight':
        this.y += this.speed;
        break;
      case 'zigzag':
        this.y += this.speed;
        this.x += Math.sin(this.zigzagPhase) * 2;
        break;
      case 'chase':
        if (player) {
          const dx = player.x - this.x;
          const dy = player.y - this.y;
          const d = Math.sqrt(dx*dx + dy*dy) || 1;
          this.x += (dx/d) * this.speed;
          this.y += (dy/d) * this.speed;
        } else {
          this.y += this.speed;
        }
        break;
      case 'hover':
        if (!this.hasEntered && this.y < this.hoverTarget) {
          this.y += this.speed * 0.6;
        } else {
          this.hasEntered = true;
          this.x += Math.sin(this.angle) * 1.5;
          this.fireTimer -= dt;
          if (this.fireTimer <= 0) {
            this._fireAtPlayer(player);
            this.fireTimer = CONFIG.ENEMY_TYPES[this.type].fireRate;
          }
        }
        break;
      case 'mixed':
        this.y += Math.sin(this.angle * 0.5) * 1.5;
        this.x += Math.cos(this.angle * 0.7) * 2;
        this.fireTimer -= dt;
        if (this.fireTimer <= 0) {
          this._fireSpread();
          this.fireTimer = 1500;
        }
        break;
    }

    this.x = clamp(this.x, this.w/2, CONFIG.CANVAS.W - this.w/2);
    if (this.y > CONFIG.CANVAS.H + 50) this.dead = true;
  }
  _fireAtPlayer(player) {
    if (!player) return;
    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    const speed = 4;
    const vx = dx/d * speed;
    const vy = dy/d * speed;
    Game.enemyBullets.push(new Bullet(this.x, this.h/2 + this.y/2, vx, vy, 1, false));
  }
  _fireSpread() {
    for (let i = -1; i <= 1; i++) {
      const angle = Math.PI/2 + i * 0.4;
      const speed = 3.5;
      Game.enemyBullets.push(new Bullet(
        this.x, this.y + this.h/2,
        Math.cos(angle) * speed, Math.sin(angle) * speed, 1, false
      ));
    }
  }
  takeDamage(dmg) {
    this.hp -= dmg;
    if (this.hp <= 0) {
      this.dead = true;
      return true;
    }
    return false;
  }
  getCoinDrop() {
    const boost = 1 + Save.getTotalPerkValue('coin_boost', 0.2);
    const base = randInt(this.coinMin, this.coinMax);
    return Math.max(1, Math.floor(base * boost));
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 15;
    ctx.fillStyle = this.color;

    ctx.beginPath();
    if (this.type === 'scout') {
      ctx.moveTo(0, this.h/2);
      ctx.lineTo(-this.w/2, -this.h/2);
      ctx.lineTo(0, -this.h/4);
      ctx.lineTo(this.w/2, -this.h/2);
    } else if (this.type === 'assault') {
      ctx.moveTo(0, -this.h/2);
      ctx.lineTo(this.w/2, 0);
      ctx.lineTo(this.w/4, this.h/2);
      ctx.lineTo(-this.w/4, this.h/2);
      ctx.lineTo(-this.w/2, 0);
    } else if (this.type === 'kami') {
      ctx.moveTo(0, this.h/2);
      ctx.lineTo(-this.w/2, 0);
      ctx.lineTo(-this.w/4, -this.h/2);
      ctx.lineTo(this.w/4, -this.h/2);
      ctx.lineTo(this.w/2, 0);
    } else if (this.type === 'heavy') {
      ctx.rect(-this.w/2, -this.h/2, this.w, this.h);
      ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(-8, -8, 16, 16);
      ctx.restore();
      return;
    } else if (this.type === 'elite') {
      ctx.moveTo(0, -this.h/2);
      ctx.lineTo(this.w/2, this.h/4);
      ctx.lineTo(this.w/3, this.h/2);
      ctx.lineTo(-this.w/3, this.h/2);
      ctx.lineTo(-this.w/2, this.h/4);
    }
    ctx.closePath();
    ctx.fill();

    if (this.type !== 'heavy') {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, this.w/6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

class Boss {
  constructor(bossId, level) {
    const data = CONFIG.BOSS_DATA[bossId];
    this.id = bossId;
    this.name = data.name;
    this.w = data.w; this.h = data.h;
    this.hp = data.hp * (1 + (level-1) * 0.3);
    this.maxHp = this.hp;
    this.speed = data.speed;
    this.color = data.color;
    this.patterns = data.patterns;
    this.fireRate = data.fireRate;
    this.coinReward = data.coinReward || 100;
    this.x = CONFIG.CANVAS.W / 2;
    this.y = -this.h;
    this.targetY = 100;
    this.phase = 0;
    this.entering = true;
    this.fireTimer = 2000;
    this.patternIndex = 0;
    this.patternTimer = 0;
    this.moveAngle = 0;
    this.invincible = 0;
    this.summonTimer = 0;
    this.laserWarning = null;
    this.laserActive = null;
    this.dead = false;
    this.hitFlash = 0;
  }
  update(dt, player) {
    if (this.invincible > 0) this.invincible -= dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;

    if (this.entering) {
      this.y += 1.2;
      if (this.y >= this.targetY) {
        this.entering = false;
        this.y = this.targetY;
      }
      return;
    }

    this.moveAngle += 0.02;
    this.x = CONFIG.CANVAS.W/2 + Math.sin(this.moveAngle) * (CONFIG.CANVAS.W/2 - this.w/2 - 20);

    const hpRatio = this.hp / this.maxHp;
    let newPhase = 0;
    if (hpRatio < 0.6) newPhase = 1;
    if (hpRatio < 0.3) newPhase = 2;
    if (newPhase > this.phase) {
      this.phase = newPhase;
      this.invincible = 1500;
      Game.shake = 15;
      Audio.play('boss');
      Game.addParticle(this.x, this.y, 30, this.color);
      if (this.phase === 2 && this.patterns.includes('summon')) {
        this._summonLingshi();
      }
    }

    this.fireTimer -= dt;
    if (this.fireTimer <= 0) {
      this._executePattern(player);
      const rateMod = 1 - this.phase * 0.2;
      this.fireTimer = this.fireRate * rateMod * rand(0.8, 1.2);
    }

    if (this.laserWarning) {
      this.laserWarning.time -= dt;
      if (this.laserWarning.time <= 0) {
        this.laserActive = {
          x: this.laserWarning.x,
          duration: 800,
          elapsed: 0
        };
        this.laserWarning = null;
      }
    }
    if (this.laserActive) {
      this.laserActive.elapsed += dt;
      if (this.laserActive.elapsed >= this.laserActive.duration) {
        this.laserActive = null;
      } else {
        Game.checkLaserCollision(this.laserActive);
      }
    }
  }
  _executePattern(player) {
    const availablePatterns = this.patterns.slice(0, 1 + this.phase);
    if (availablePatterns.length === 0) return;
    const pattern = availablePatterns[Math.floor(Math.random() * availablePatterns.length)];

    switch(pattern) {
      case 'spread': this._spread(); break;
      case 'ring': this._ring(); break;
      case 'spiral': this._spiral(); break;
      case 'homing': this._homing(player); break;
      case 'laser': this._laser(); break;
      case 'summon': this._summonLingshi(); break;
    }
  }
  _spread() {
    const count = 5 + this.phase * 2;
    const spread = Math.PI / 3;
    for (let i = 0; i < count; i++) {
      const t = count === 1 ? 0.5 : i / (count - 1);
      const angle = Math.PI/2 - spread/2 + spread * t;
      const speed = 4 + this.phase * 0.5;
      Game.enemyBullets.push(new Bullet(
        this.x, this.y + this.h/2,
        Math.cos(angle) * speed, Math.sin(angle) * speed, 1, false
      ));
    }
  }
  _ring() {
    const count = 12 + this.phase * 4;
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      const speed = 3 + this.phase * 0.5;
      Game.enemyBullets.push(new Bullet(
        this.x, this.y,
        Math.cos(angle) * speed, Math.sin(angle) * speed, 1, false
      ));
    }
  }
  _spiral() {
    const baseAngle = Math.random() * Math.PI * 2;
    for (let i = 0; i < 8; i++) {
      const angle = baseAngle + i * 0.3 + this.moveAngle;
      const speed = 3.5;
      Game.enemyBullets.push(new Bullet(
        this.x, this.y + 20,
        Math.cos(angle) * speed, Math.sin(angle) * speed, 1, false
      ));
    }
  }
  _homing(player) {
    if (!player) return;
    const dx = player.x - this.x;
    const dy = player.y - this.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    const speed = 3;
    const vx = dx/d * speed;
    const vy = dy/d * speed;
    const bullet = new Bullet(this.x, this.y + this.h/2, vx, vy, 1, false);
    bullet.homing = true;
    bullet.life = 3000;
    Game.enemyBullets.push(bullet);
  }
  _laser() {
    this.laserWarning = {
      x: this.x + rand(-this.w/3, this.w/3),
      time: 800
    };
  }
  _summonLingshi() {
    Game.spawnEnemy('elite', this.x - 80, this.y + 40);
    Game.spawnEnemy('elite', this.x + 80, this.y + 40);
  }
  takeDamage(dmg) {
    if (this.invincible > 0) return false;
    this.hp -= dmg;
    this.hitFlash = 100;
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      return true;
    }
    return false;
  }
  getCoinDrop() {
    const boost = 1 + Save.getTotalPerkValue('coin_boost', 0.2);
    return Math.floor(this.coinReward * boost);
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    if (this.invincible > 0 && Math.floor(this.invincible / 100) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }

    ctx.shadowColor = this.color;
    ctx.shadowBlur = 25;
    ctx.fillStyle = this.hitFlash > 0 ? '#fff' : this.color;

    ctx.beginPath();
    ctx.moveTo(0, this.h/2);
    ctx.lineTo(-this.w/2, this.h/4);
    ctx.lineTo(-this.w/2 + 10, -this.h/4);
    ctx.lineTo(-this.w/3, -this.h/2);
    ctx.lineTo(this.w/3, -this.h/2);
    ctx.lineTo(this.w/2 - 10, -this.h/4);
    ctx.lineTo(this.w/2, this.h/4);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(-this.w/4, -10, this.w/2, 20);

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-20, 0, 5, 0, Math.PI * 2);
    ctx.arc(20, 0, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = this.color;
    const thrustH = 10 + Math.sin(this.moveAngle * 10) * 5;
    ctx.beginPath();
    ctx.moveTo(-15, this.h/2);
    ctx.lineTo(0, this.h/2 + thrustH);
    ctx.lineTo(15, this.h/2);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    if (this.laserWarning) {
      ctx.save();
      ctx.strokeStyle = '#f43f5e';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 5]);
      ctx.globalAlpha = 0.7 + Math.sin(Date.now()/50) * 0.3;
      ctx.beginPath();
      ctx.moveTo(this.laserWarning.x, this.y + this.h/2);
      ctx.lineTo(this.laserWarning.x, CONFIG.CANVAS.H);
      ctx.stroke();
      ctx.restore();
    }
    if (this.laserActive) {
      ctx.save();
      const grad = ctx.createLinearGradient(this.laserActive.x - 15, 0, this.laserActive.x + 15, 0);
      grad.addColorStop(0, 'rgba(244,63,94,0)');
      grad.addColorStop(0.5, '#f43f5e');
      grad.addColorStop(1, 'rgba(244,63,94,0)');
      ctx.fillStyle = grad;
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 20;
      ctx.fillRect(this.laserActive.x - 15, this.y + this.h/2, 30, CONFIG.CANVAS.H - this.y - this.h/2);
      ctx.restore();
    }
  }
}

// ============ GAME CLASS ============
const Game = {
  canvas: null,
  ctx: null,
  state: 'menu',
  player: null,
  bullets: [],
  enemyBullets: [],
  enemies: [],
  powerups: [],
  coins: [],
  particles: [],
  boss: null,
  score: 0,
  level: 1,
  levelTime: 0,
  spawnTimer: 0,
  bossSpawned: false,
  coinsEarned: 0,
  lastShot: 0,
  shake: 0,
  combo: 0,
  comboTimer: 0,
  slowTime: 0,
  shieldTime: 0,
  invPlayer: 0,
  starLayers: [],
  godMode: false,

  init() {
    this.canvas = document.getElementById('game');
    if (!this.canvas) {
      console.error('Canvas element not found!');
      alert('游戏画布加载失败');
      return;
    }
    this.ctx = this.canvas.getContext('2d');
    if (!this.ctx) {
      console.error('Canvas 2D context not available!');
      alert('Canvas 2D 上下文不可用');
      return;
    }
    // 加载存档
    Save.load();
    this._initStars();
    try { Input.init(); } catch(e) { console.warn('Input init failed:', e); }
    try { this._setupResponsive(); } catch(e) { console.warn('Responsive setup failed:', e); }
    document.getElementById('coinText').textContent = Save.data.totalCoins;
    requestAnimationFrame(t => this.loop(t));
    console.log('Game initialized. State:', this.state);
  },

  _initStars() {
    this.starLayers = [];
    for (let layer = 0; layer < 3; layer++) {
      const stars = [];
      const count = [40, 30, 20][layer];
      for (let i = 0; i < count; i++) {
        stars.push({
          x: rand(0, CONFIG.CANVAS.W),
          y: rand(0, CONFIG.CANVAS.H),
          size: [0.5, 1, 2][layer],
          speed: [0.3, 0.6, 1.2][layer],
          alpha: rand(0.3, 0.8)
        });
      }
      this.starLayers.push(stars);
    }
  },

  _setupResponsive() {
    const container = document.getElementById('gameContainer');
    const resize = () => {
      const maxW = window.innerWidth * 0.95;
      const maxH = window.innerHeight * 0.95;
      let w = maxW;
      let h = w * 1.5;
      if (h > maxH) {
        h = maxH;
        w = h / 1.5;
      }
      container.style.width = w + 'px';
      container.style.height = h + 'px';
    };
    resize();
    window.addEventListener('resize', resize);
  },

  start() {
    Audio.init();
    this.score = 0;
    this.level = 1;
    this.coinsEarned = 0;
    this.godMode = false;
    this._updateGodModeIndicator();
    this._initLevel();
    this.state = 'playing';
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
  },

  restart() {
    this.score = 0;
    this.level = 1;
    this.coinsEarned = 0;
    this.godMode = false;
    this._updateGodModeIndicator();
    this._initLevel();
    this.state = 'playing';
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('pauseScreen').classList.add('hidden');
    document.getElementById('levelClearScreen').classList.add('hidden');
  },

  toMenu() {
    this.state = 'menu';
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('startScreen').classList.remove('hidden');
  },

  togglePause() {
    if (this.state === 'playing') {
      this.state = 'paused';
      document.getElementById('pauseScreen').classList.remove('hidden');
    } else if (this.state === 'paused') {
      this.state = 'playing';
      document.getElementById('pauseScreen').classList.add('hidden');
    }
  },

  toggleGodMode() {
    this.godMode = !this.godMode;
    this._updateGodModeIndicator();
    if (this.godMode && this.player) {
      // 开启时直接满配
      this.player.power = CONFIG.POWER_LEVELS.length - 1;
      this.player.bombs = 99;
      this.player.hp = this.player.maxHp;
      this.player.invincibility = 999999;
      Audio.play('powerup');
    } else if (this.player) {
      this.player.invincibility = 0;
    }
    this._updateHUD();
  },

  _updateGodModeIndicator() {
    document.getElementById('godModeIndicator').classList.toggle('show', this.godMode);
    const cheatBtn = document.getElementById('cheatBtn');
    if (cheatBtn) {
      cheatBtn.classList.toggle('active', this.godMode);
      cheatBtn.setAttribute('aria-pressed', this.godMode ? 'true' : 'false');
    }
  },

  _initLevel() {
    const p = CONFIG.PLAYER;
    const bonusPower = Save.getTotalPerkValue('power_start', 1);
    const bonusHp = Save.getTotalPerkValue('hp_start', 1);
    const bonusBombs = Save.getTotalPerkValue('bomb_start', 1);
    const speedBoost = 1 + Save.getTotalPerkValue('speed_boost', 0.1);

    const maxHp = p.maxHp + bonusHp;
    const maxBombs = p.maxBombs + bonusBombs;
    const power = Math.min(CONFIG.POWER_LEVELS.length - 1, 1 + bonusPower);

    // 只有第一关才重置玩家属性（后续关卡保留）
    if (this.level === 1 || !this.player) {
      this.player = {
        x: CONFIG.CANVAS.W / 2,
        y: CONFIG.CANVAS.H - 100,
        w: p.w, h: p.h,
        hp: maxHp, maxHp: maxHp,
        bombs: maxBombs, maxBombs: maxBombs,
        power: power,
        speed: p.speed * speedBoost,
        speedBase: p.speed * speedBoost,
        invincibility: 0,
        enginePhase: 0
      };
      if (this.godMode) {
        this.player.power = CONFIG.POWER_LEVELS.length - 1;
        this.player.bombs = 99;
        this.player.invincibility = 999999;
      }
    } else {
      // 通关关卡给予少量恢复
      this.player.hp = Math.min(this.player.hp + 1, this.player.maxHp);
      this.player.bombs = Math.min(this.player.bombs + 1, this.player.maxBombs);
      this.player.x = CONFIG.CANVAS.W / 2;
      this.player.y = CONFIG.CANVAS.H - 100;
      this.player.invincibility = this.godMode ? 999999 : 2000;
    }

    this.bullets = [];
    this.enemyBullets = [];
    this.enemies = [];
    this.powerups = [];
    this.coins = [];
    this.particles = [];
    this.boss = null;
    this.levelTime = 0;
    this.spawnTimer = 1000;
    this.bossSpawned = false;
    this.combo = 0;
    this.comboTimer = 0;
    this.slowTime = 0;
    this.shieldTime = 3000;
    this.invPlayer = 0;
    this._updateHUD();
  },

  _nextLevel() {
    this.level++;
    if (this.level > 5) {
      this._gameWin();
      return;
    }
    document.getElementById('levelClearScreen').classList.remove('hidden');
    document.getElementById('bossBar').style.display = 'none';
    setTimeout(() => {
      this._initLevel();
      document.getElementById('levelClearScreen').classList.add('hidden');
      this.state = 'playing';
    }, 3000);
  },

  _gameWin() {
    this.state = 'gameover';
    this._finalize();
    // 修改标题显示胜利
    const overScreen = document.getElementById('gameOverScreen');
    overScreen.querySelector('.title').textContent = '🎉 VICTORY';
    overScreen.querySelector('.title').style.color = '#10b981';
    document.getElementById('finalScore').textContent = this.score;
    Save.setHighScore(this.score);
    document.getElementById('highScore').textContent = Save.data.highScore;
    document.getElementById('finalCoins').textContent = '+' + this.coinsEarned;
    document.getElementById('totalCoins').textContent = Save.data.totalCoins;
    overScreen.classList.remove('hidden');
  },

  _gameOver() {
    this.state = 'gameover';
    this._finalize();
    const overScreen = document.getElementById('gameOverScreen');
    overScreen.querySelector('.title').textContent = 'GAME OVER';
    overScreen.querySelector('.title').style.color = '#f43f5e';
    document.getElementById('finalScore').textContent = this.score;
    Save.setHighScore(this.score);
    document.getElementById('highScore').textContent = Save.data.highScore;
    document.getElementById('finalCoins').textContent = '+' + this.coinsEarned;
    document.getElementById('totalCoins').textContent = Save.data.totalCoins;
    overScreen.classList.remove('hidden');
  },

  _finalize() {
    // 结算金币到存档
    if (this.coinsEarned > 0) {
      Save.addCoins(this.coinsEarned);
    }
    document.getElementById('coinText').textContent = Save.data.totalCoins;
  },

  _levelClear() {
    Save.setHighScore(this.score);
    Audio.play('levelup');
    document.getElementById('levelClearText').textContent = `第 ${this.level} 关通过！`;
    this.state = 'levelclear';
    setTimeout(() => this._nextLevel(), 2500);
  },

  useBomb() {
    if (this.state !== 'playing' || !this.player) return;
    if (!this.godMode && this.player.bombs <= 0) return;
    if (!this.godMode) this.player.bombs--;
    Audio.play('bomb');
    this.shake = 20;
    this.enemyBullets = [];
    this.enemies.forEach(e => {
      e.takeDamage(5);
    });
    if (this.boss && !this.boss.entering) {
      this.boss.takeDamage(15);
    }
    for (let i = 0; i < 40; i++) {
      this.addParticle(
        rand(0, CONFIG.CANVAS.W), rand(0, CONFIG.CANVAS.H),
        rand(-5, 5), rand(-5, 5), 1000, '#fbbf24', 4
      );
    }
    this._updateHUD();
  },

  addParticle(x, y, count, color, size) {
    // 粒子数量上限，防止 boss 战堆积拖慢渲染
    if (this.particles.length > 280) {
      this.particles.splice(0, this.particles.length - 240);
    }
    const c = typeof count === 'number' && typeof color === 'string';
    // 兼容两种调用: (x,y,count,color) 或 (x,y,vx,vy,life,color,size)
    if (c && !isNaN(count) && count < 50) {
      const num = count;
      const col = color;
      const sz = size || 3;
      for (let i = 0; i < num; i++) {
        this.particles.push(new Particle(
          x, y,
          rand(-4, 4), rand(-4, 4),
          rand(300, 800), col, sz
        ));
      }
    } else {
      // 老格式: (x,y,vx,vy,life,color,size)
      this.particles.push(new Particle(x, y, count, color, arguments[4], arguments[5], arguments[6] || 3));
    }
  },

  spawnEnemy(type, x, y) {
    const enemy = new Enemy(x, y, type);
    this.enemies.push(enemy);
  },

  _spawnCoin(x, y, value) {
    this.coins.push(new Coin(x, y, value));
  },

  checkLaserCollision(laser) {
    if (!this.player) return;
    if (Math.abs(this.player.x - laser.x) < 20 &&
        this.player.y > laser.y - 20) {
      if (this.godMode) return;
      if (this.shieldTime > 0) {
        this.shieldTime = 0;
        this.invPlayer = 1000;
      } else if (this.invPlayer <= 0) {
        this._damagePlayer();
      }
    }
  },

  _damagePlayer(dmg=1) {
    if (this.godMode) return;
    if (this.player.invincibility > 0) return;
    if (this.shieldTime > 0) {
      this.shieldTime = 0;
      this.invPlayer = 1000;
      return;
    }
    this.player.hp -= dmg;
    this.player.invincibility = CONFIG.PLAYER.invincibleTime;
    this.shake = 10;
    this.combo = 0;
    Audio.play('hit');
    if (this.player.hp <= 0) {
      this.addParticle(this.player.x, this.player.y, 50, '#f43f5e');
      this._gameOver();
    }
    this._updateHUD();
  },

  _updateHUD() {
    if (!this.player) return;
    document.getElementById('hpFill').style.width = (this.player.hp / this.player.maxHp * 100) + '%';
    document.getElementById('scoreText').textContent = this.score;
    document.getElementById('bombText').textContent = this.godMode ? '∞' : this.player.bombs;
    document.getElementById('levelText').textContent = CONFIG.LEVELS[this.level].name;
    document.getElementById('coinText').textContent = Save.data.totalCoins;
    if (this.boss && !this.boss.entering) {
      document.getElementById('bossBar').style.display = 'block';
      document.getElementById('bossFill').style.width = (this.boss.hp / this.boss.maxHp * 100) + '%';
      document.getElementById('bossName').textContent = this.boss.name;
    } else {
      document.getElementById('bossBar').style.display = 'none';
    }
    const comboEl = document.getElementById('comboDisplay');
    if (this.combo >= 3) {
      comboEl.textContent = `COMBO ×${this.combo}`;
      comboEl.classList.add('show');
    } else {
      comboEl.classList.remove('show');
    }
  },

  _firePlayerBullet() {
    if (!this.player) return;
    const now = Date.now();
    const pw = this.player.power;
    const lvl = CONFIG.POWER_LEVELS[pw];
    if (!lvl) return;

    // 开挂模式射速翻倍
    const rate = this.godMode ? lvl.rate * 0.4 : lvl.rate;
    if (now - this.lastShot < rate) return;
    this.lastShot = now;

    const px = this.player.x;
    const py = this.player.y - 15;
    const spreadRad = lvl.spread * Math.PI / 180;
    const dmgBoost = 1 + Save.getTotalPerkValue('dmg_boost', 0.15);
    const finalDmg = lvl.dmg * dmgBoost * (this.godMode ? 2 : 1);

    for (let i = 0; i < lvl.count; i++) {
      const t = lvl.count === 1 ? 0.5 : i / (lvl.count - 1);
      const angle = -Math.PI/2 - spreadRad/2 + spreadRad * t;
      const speed = 10;
      this.bullets.push(new Bullet(
        px, py,
        Math.cos(angle) * speed, Math.sin(angle) * speed, finalDmg, true
      ));
    }
    Audio.play('shoot');
  },

  _dropPowerUp(x, y) {
    const r = Math.random();
    if (r < 0.30) {
      this.powerups.push(new PowerUp(x, y, 'power'));
    } else if (r < 0.50) {
      this.powerups.push(new PowerUp(x, y, 'heart'));
    } else if (r < 0.68) {
      this.powerups.push(new PowerUp(x, y, 'bomb'));
    } else if (r < 0.82) {
      this.powerups.push(new PowerUp(x, y, 'shield'));
    } else {
      this.powerups.push(new PowerUp(x, y, 'slow'));
    }
  },

  _applyPowerUp(type) {
    if (!this.player) return;
    Audio.play('powerup');
    switch(type) {
      case 'power':
        if (this.player.power < CONFIG.POWER_LEVELS.length - 1) this.player.power++;
        else this.score += 2000;
        break;
      case 'heart':
        if (this.player.hp < this.player.maxHp) this.player.hp++;
        break;
      case 'bomb':
        if (this.player.bombs < this.player.maxBombs) this.player.bombs++;
        break;
      case 'shield':
        this.shieldTime = 8000;
        break;
      case 'slow':
        this.slowTime = 5000;
        break;
    }
    this._updateHUD();
  },

  update(dt) {
    if (this.state !== 'playing' || !this.player) return;

    const slowFactor = this.slowTime > 0 ? 0.5 : 1;
    const edt = dt * slowFactor;

    this.levelTime += dt;
    if (this.slowTime > 0) this.slowTime -= dt;
    if (this.shieldTime > 0) this.shieldTime -= dt;
    if (this.player.invincibility > 0 && !this.godMode) this.player.invincibility -= dt;
    if (this.godMode) this.player.invincibility = 999999;
    if (this.invPlayer > 0) this.invPlayer -= dt;
    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) this.combo = 0;
    }
    if (this.shake > 0) this.shake -= dt * 0.05;

    const mv = Input.getMovement();
    const spd = this.godMode ? this.player.speedBase * 1.5 : this.player.speedBase;
    this.player.x += mv.x * spd;
    this.player.y += mv.y * spd;
    this.player.x = clamp(this.player.x, this.player.w/2, CONFIG.CANVAS.W - this.player.w/2);
    this.player.y = clamp(this.player.y, this.player.h/2, CONFIG.CANVAS.H - this.player.h/2);
    this.player.enginePhase += 0.3;

    this._firePlayerBullet();

    const level = CONFIG.LEVELS[this.level];
    if (this.levelTime < level.duration && !this.bossSpawned) {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0) {
        const type = level.types[randInt(0, level.types.length - 1)];
        const x = rand(40, CONFIG.CANVAS.W - 40);
        this.spawnEnemy(type, x, -30);
        if (Math.random() < 0.3) {
          this.spawnEnemy(type, x + 60, -30);
        }
        this.spawnTimer = level.spawnRate * rand(0.7, 1.3);
      }
    } else if (!this.bossSpawned) {
      this.bossSpawned = true;
      this.boss = new Boss(level.bossId, this.level);
      Audio.play('boss');
      this.shake = 10;
    }

    this.bullets.forEach(b => b.update(dt, this.player));
    this.enemyBullets.forEach(b => b.update(edt, this.player));
    this.enemies.forEach(e => e.update(edt, this.player));
    this.powerups.forEach(p => p.update(dt));
    this.coins.forEach(c => c.update(dt, this.player));
    this.particles.forEach(p => p.update(dt));
    if (this.boss) this.boss.update(dt, this.player);

    this._checkCollisions();

    this.bullets = this.bullets.filter(b => !b.dead);
    this.enemyBullets = this.enemyBullets.filter(b => !b.dead);
    // 敌方弹幕上限，防止 boss 高频弹幕堆积
    if (this.enemyBullets.length > 220) {
      this.enemyBullets.splice(0, this.enemyBullets.length - 220);
    }
    this.enemies = this.enemies.filter(e => !e.dead);
    this.powerups = this.powerups.filter(p => !p.dead);
    this.coins = this.coins.filter(c => !c.dead);
    this.particles = this.particles.filter(p => !p.dead);

    if (this.boss && this.boss.dead) {
      this.addParticle(this.boss.x, this.boss.y, 60, this.boss.color);
      Audio.play('explode');
      // Boss 掉落金币
      const bossCoins = this.boss.getCoinDrop();
      for (let i = 0; i < Math.min(20, bossCoins / 5); i++) {
        this._spawnCoin(
          this.boss.x + rand(-this.boss.w/2, this.boss.w/2),
          this.boss.y + rand(-this.boss.h/2, this.boss.h/2),
          Math.ceil(bossCoins / 20)
        );
      }
      this.score += 5000;
      this.boss = null;
      this._levelClear();
    }

    this._updateHUD();
  },

  _checkCollisions() {
    // 玩家子弹 vs 敌人
    for (const b of this.bullets) {
      for (const e of this.enemies) {
        if (!e.dead && checkCollision(b, e)) {
          b.dead = true;
          const killed = e.takeDamage(b.dmg);
          this.addParticle(b.x, b.y, 3, '#fbbf24', 2);
          if (killed) {
            // 开挂模式分数x2
            const s = this.godMode ? e.score * 2 : e.score;
            this.score += s * (1 + this.combo * 0.05);
            this.combo++;
            this.comboTimer = 1500;
            this.addParticle(e.x, e.y, 15, e.color);
            Audio.play('explode');
            // 掉落金币
            const coinVal = e.getCoinDrop();
            // 根据金币值生成不同数量的金币实体
            const splits = Math.min(5, Math.ceil(coinVal / 3));
            const perCoin = Math.ceil(coinVal / splits);
            for (let i = 0; i < splits; i++) {
              this._spawnCoin(e.x + rand(-10, 10), e.y + rand(-10, 10), perCoin);
            }
            // 掉落道具
            if (Math.random() < e.dropRate) {
              this._dropPowerUp(e.x, e.y);
            }
          }
          break;
        }
      }

      // 玩家子弹 vs Boss
      if (!b.dead && this.boss && !this.boss.dead && !this.boss.entering) {
        if (checkCollision(b, this.boss)) {
          b.dead = true;
          const killed = this.boss.takeDamage(b.dmg);
          this.addParticle(b.x, b.y, 2, '#22d3ee', 1);
          if (killed) {
            this.addParticle(this.boss.x, this.boss.y, 40, this.boss.color);
          }
        }
      }
    }

    if (this.player) {
      // 敌方子弹 vs 玩家
      for (const eb of this.enemyBullets) {
        if (!eb.dead && checkCollision(eb, this.player)) {
          eb.dead = true;
          this._damagePlayer();
        }
      }

      // 敌机 vs 玩家
      for (const e of this.enemies) {
        if (!e.dead && checkCollision(e, this.player)) {
          e.takeDamage(99);
          this._damagePlayer();
          this.addParticle(this.player.x, this.player.y, 20, '#f43f5e');
        }
      }

      // Boss vs 玩家
      if (this.boss && !this.boss.dead && !this.boss.entering) {
        if (checkCollision(this.boss, this.player)) {
          this._damagePlayer(2);
        }
      }

      // 道具 vs 玩家
      for (const p of this.powerups) {
        if (!p.dead && checkCollision(p, this.player)) {
          p.dead = true;
          this._applyPowerUp(p.type);
          this.addParticle(p.x, p.y, 10, {
            power:'#22d3ee', heart:'#f43f5e', bomb:'#f59e0b',
            shield:'#10b981', slow:'#c4b5fd'
          }[p.type]);
        }
      }

      // 金币 vs 玩家
      for (const c of this.coins) {
        if (!c.dead && checkCollision(c, this.player, 0)) {
          c.dead = true;
          this.coinsEarned += c.value;
          Save.addCoins(c.value);
          Audio.play('coin');
          this.addParticle(c.x, c.y, 4, '#fbbf24', 2);
        }
      }
    }
  },

  updateStars() {
    const speedMul = this.godMode ? 3 : 1;
    for (const layer of this.starLayers) {
      for (const s of layer) {
        s.y += s.speed * speedMul;
        if (s.y > CONFIG.CANVAS.H) {
          s.y = -5;
          s.x = rand(0, CONFIG.CANVAS.W);
        }
      }
    }
  },

  drawStars() {
    const ctx = this.ctx;
    for (const layer of this.starLayers) {
      for (const s of layer) {
        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = this.godMode && Math.random() < 0.1 ? '#fbbf24' : '#fff';
        ctx.fillRect(s.x, s.y, s.size, s.size);
        ctx.restore();
      }
    }
  },

  drawPlayer() {
    if (!this.player) return;
    const p = this.player;
    const ctx = this.ctx;
    ctx.save();
    ctx.translate(p.x, p.y);

    if (p.invincibility > 0 && Math.floor(p.invincibility / 80) % 2 === 0 && !this.godMode) {
      ctx.globalAlpha = 0.5;
    }

    // 开挂模式的光环
    if (this.godMode) {
      const t = Date.now() / 200;
      ctx.save();
      // 外光环
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        const r = 35 + i * 8 + Math.sin(t + i) * 3;
        ctx.strokeStyle = `hsla(${(t * 30 + i * 60) % 360}, 90%, 60%, ${0.4 - i * 0.1})`;
        ctx.lineWidth = 2.5 - i * 0.5;
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
      }
      // 彩虹光晕粒子
      for (let i = 0; i < 8; i++) {
        const a = t * 2 + i * Math.PI / 4;
        const px = Math.cos(a) * 40;
        const py = Math.sin(a) * 40;
        ctx.fillStyle = `hsla(${(t * 50 + i * 45) % 360}, 90%, 65%, 0.8)`;
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    if (this.shieldTime > 0) {
      ctx.save();
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.5 + Math.sin(Date.now()/100) * 0.3;
      ctx.beginPath();
      ctx.arc(0, 0, 30, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    const mainColor = this.godMode ? '#fbbf24' : '#00d4ff';
    const subColor = this.godMode ? '#f59e0b' : '#22d3ee';

    ctx.shadowColor = mainColor;
    ctx.shadowBlur = this.godMode ? 30 : 20;

    ctx.fillStyle = mainColor;
    ctx.beginPath();
    ctx.moveTo(0, -p.h/2);
    ctx.lineTo(-p.w/2, p.h/2);
    ctx.lineTo(-p.w/4, p.h/3);
    ctx.lineTo(0, p.h/4);
    ctx.lineTo(p.w/4, p.h/3);
    ctx.lineTo(p.w/2, p.h/2);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = subColor;
    ctx.beginPath();
    ctx.moveTo(0, -p.h/3);
    ctx.lineTo(-p.w/3, p.h/4);
    ctx.lineTo(p.w/3, p.h/4);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();

    const engineColor = this.godMode ? `hsl(${(Date.now()/3) % 360}, 90%, 60%)` : `rgba(255, 200, 50, ${0.7 + Math.sin(p.enginePhase) * 0.3})`;
    const engineFlicker = 0.7 + Math.sin(p.enginePhase) * 0.3;
    ctx.shadowBlur = 15;
    ctx.fillStyle = engineColor;
    ctx.beginPath();
    ctx.moveTo(-6, p.h/2);
    ctx.lineTo(0, p.h/2 + 15 + Math.sin(p.enginePhase*2) * 5);
    ctx.lineTo(6, p.h/2);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  },

  render() {
    const ctx = this.ctx;
    ctx.save();

    if (this.shake > 0) {
      ctx.translate(
        rand(-this.shake, this.shake),
        rand(-this.shake, this.shake)
      );
    }

    // 背景：开挂模式下变成深色+闪烁
    if (this.godMode) {
      const t = Date.now() / 100;
      const g = ctx.createLinearGradient(0, 0, 0, CONFIG.CANVAS.H);
      g.addColorStop(0, `hsla(${(t) % 360}, 60%, 8%, 1)`);
      g.addColorStop(0.5, `hsla(${(t+60) % 360}, 60%, 12%, 1)`);
      g.addColorStop(1, `hsla(${(t+120) % 360}, 60%, 8%, 1)`);
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = '#0a0e1a';
    }
    ctx.fillRect(0, 0, CONFIG.CANVAS.W, CONFIG.CANVAS.H);

    this.updateStars();
    this.drawStars();

    this.bullets.forEach(b => b.draw(ctx));
    this.enemyBullets.forEach(b => b.draw(ctx));
    this.powerups.forEach(p => p.draw(ctx));
    this.coins.forEach(c => c.draw(ctx));
    this.enemies.forEach(e => e.draw(ctx));
    if (this.boss) this.boss.draw(ctx);
    this.particles.forEach(p => p.draw(ctx));
    this.drawPlayer();

    if (this.slowTime > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(124, 58, 237, 0.1)';
      ctx.fillRect(0, 0, CONFIG.CANVAS.W, CONFIG.CANVAS.H);
      ctx.restore();
    }

    ctx.restore();
  },

  loop(ts) {
    const dt = Math.min(ts - (this.lastTime || ts), 50);
    this.lastTime = ts;

    if (this.state === 'playing') {
      this.update(dt);
    }
    this.render();

    requestAnimationFrame(t => this.loop(t));
  }
};

// 暴露到全局作用域
window.Game = Game;
window.CONFIG = CONFIG;
window.Audio = Audio;
window.Input = Input;
window.Shop = Shop;
window.Save = Save;

window.onload = () => {
  try {
    Game.init();
    console.log('Game initialized successfully');
  } catch(e) {
    console.error('Game init error:', e);
    alert('游戏初始化失败: ' + e.message);
  }
};

// 全局错误捕获
window.onerror = function(msg, url, line) {
  console.error('Error:', msg, 'at line', line);
};
</script>
